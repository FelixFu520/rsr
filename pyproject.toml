[project]
name = "real2sim2real"
version = "0.1.0"
description = "Real2Sim2Real framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pyarrow>=14.0",
    "dynaconf>=3.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
rsr = "real2sim2real.core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["real2sim2real"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# 后端名 = 配置里的 backend 字符串。实现按任务分文件：
# *_physic_solver（物理求解器验证）、*_sorting（分拣包裹）、*_fire_inspection（机器狗巡检）、
# *_halo（G1 爬行/弯腰过桌与落座）。
[project.entry-points."real2sim2real.simworld.backends"]
newton_diagnostic = "real2sim2real.simworld.simworld_physic_solver:NewtonDiagnosticWorld"
stub = "real2sim2real.simworld.stub:StubSimWorld"
isaacsim = "real2sim2real.simworld.isaacsim:IsaacsimWorld"

[project.entry-points."real2sim2real.scene.backends"]
pickplace_carton = "real2sim2real.scene.scene_physic_solver:CartonScene"
screw_assembly = "real2sim2real.scene.scene_physic_solver:ScrewScene"
stub = "real2sim2real.scene.scene_stub:StubScene"
pickplace_cloth = "real2sim2real.scene.scene_physic_solver:PickPlaceClothScene"
pickplace_rigid = "real2sim2real.scene.scene_physic_solver:PickPlaceRigidScene"
newton_cloth_franka = "real2sim2real.scene.scene_physic_solver:OfficialClothScene"
pickplace_package = "real2sim2real.scene.scene_physic_solver:PackageScene"
sorting_package = "real2sim2real.scene.scene_sorting:SortingScene"
fire_warehouse = "real2sim2real.scene.scene_fire_inspection:FireWarehouseScene"
halo_home = "real2sim2real.scene.scene_halo:HaloHomeScene"

[project.entry-points."real2sim2real.robot.backends"]
franka_carton_gripper = "real2sim2real.robot.robot_physic_solver:CartonGripperRobot"
screw_spindle = "real2sim2real.robot.robot_physic_solver:ScrewSpindleRobot"
stub = "real2sim2real.robot.robot_stub:StubRobot"
franka_newton = "real2sim2real.robot.robot_physic_solver:FrankaNewtonRobot"
franka_physx = "real2sim2real.robot.robot_physic_solver:FrankaPhysxRobot"
franka_package_pads = "real2sim2real.robot.robot_physic_solver:PackagePadRobot"
pro_m6_newton = "real2sim2real.robot.robot_sorting:SortingRobot"
x30_kinematic = "real2sim2real.robot.robot_fire_inspection:X30Robot"
g1_sonic = "real2sim2real.robot.robot_halo:G1SonicRobot"

[project.entry-points."real2sim2real.planner.backends"]
pickplace_carton = "real2sim2real.planner.planner_physic_solver:CartonPlanner"
screw_assembly = "real2sim2real.planner.planner_physic_solver:ScrewPlanner"
stub = "real2sim2real.planner.planner_stub:StubPlanner"
pickplace_cloth = "real2sim2real.planner.planner_physic_solver:PickPlaceClothPlanner"
newton_cloth_franka = "real2sim2real.planner.planner_physic_solver:OfficialClothPlanner"
pickplace_package = "real2sim2real.planner.planner_physic_solver:PackagePlanner"
sorting_package = "real2sim2real.planner.planner_sorting:SortingPlanner"
sorting_stream = "real2sim2real.planner.planner_sorting:SortingStreamPlanner"
fire_patrol = "real2sim2real.planner.planner_fire_inspection:FirePatrolPlanner"
sonic_tracking = "real2sim2real.planner.planner_halo:SonicTrackingPlanner"

[project.entry-points."real2sim2real.job.backends"]
pickplace_carton = "real2sim2real.job.job_physic_solver:CartonJob"
screw_assembly = "real2sim2real.job.job_physic_solver:ScrewJob"
stub = "real2sim2real.job.job_stub:StubJob"
pickplace_cloth = "real2sim2real.job.job_physic_solver:PhysicSolverJob"
sorting_package = "real2sim2real.job.job_sorting:SortingJob"
fire_inspection = "real2sim2real.job.job_fire_inspection:FireInspectionJob"
halo = "real2sim2real.job.job_halo:HaloJob"

[project.entry-points."real2sim2real.cli.commands"]
collect = "real2sim2real.job.cli:register"

[tool.pytest.ini_options]
testpaths = ["tests"]
