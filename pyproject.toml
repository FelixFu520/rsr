[project]
name = "real2sim2real"
version = "0.1.0"
description = "Real2Sim2Real framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pyarrow>=14.0",
    "dynaconf>=3.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
rsr = "real2sim2real.core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["real2sim2real"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.entry-points."real2sim2real.job.backends"]
stub = "real2sim2real.job.job_stub:StubJob"
sorting = "real2sim2real.job.job_sorting_packages:SortingJob"
franka_demo = "real2sim2real.job.job_franka_demo:FrankaDemoJob"

[project.entry-points."real2sim2real.planner.backends"]
stub = "real2sim2real.planner.planner_stub:StubPlanner"
sorting = "real2sim2real.planner.planner_sorting_packages:SortingPlanner"
franka_demo = "real2sim2real.planner.planner_franka_demo:FrankaDemoPlanner"

[project.entry-points."real2sim2real.robot.backends"]
stub = "real2sim2real.robot.robot_stub:StubRobot"
pro_m6 = "real2sim2real.robot.robot_pro_m6:ProM6Robot"
franka_demo = "real2sim2real.robot.robot_franka_demo:FrankaDemoRobot"

[project.entry-points."real2sim2real.scene.backends"]
stub = "real2sim2real.scene.scene_stub:StubScene"
sorting = "real2sim2real.scene.scene_sorting_packages:SortingScene"
franka_demo = "real2sim2real.scene.scene_franka_demo:FrankaDemoScene"

[project.entry-points."real2sim2real.simworld.backends"]
stub = "real2sim2real.simworld.stub:StubSimWorld"
isaacsim = "real2sim2real.simworld.isaacsim:IsaacsimSimWorld"
franka_demo = "real2sim2real.simworld.franka_demo:FrankaDemoWorld"

[project.entry-points."real2sim2real.cli.commands"]
collect = "real2sim2real.job.cli:register"

[tool.pytest.ini_options]
testpaths = ["tests"]
