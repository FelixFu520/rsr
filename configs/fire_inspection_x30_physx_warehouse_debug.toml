# 调试配置：继承正式配置，结果写到 outputs/xunjian-debug（可重复运行，覆盖上次数据集）。
# 失败轨迹也导出为 diagnostic 数据；看 map/patrol_map*.png 与 diagnostics/<run>/ 排查。
inherit = "fire_inspection_x30_physx_warehouse.toml"

[sim_world]
rt_subframes = 2

[job]
output_dir = "outputs/xunjian-debug"
overwrite_dataset = true
timeout_s = 3600.0

[job.recorder]
save_failed_episodes = true
