# 原生 Pro-M6 30 mm 指垫，100 g 衣物轻载对照；尚待完整物理验收。
inherit = "PhysicSolver_mujoco_vbd_sorting_package.toml"

[sim_world]
newton_iterations = 48

[scene]
cloth_usd_path = "assets/PhysicSolver/Package/v7_sorting_refined/parcel_two_mesh.usd"
garment_mass_kg = 0.1

[robot]
initial_gripper_rad = 0.28

[planner]
open_gripper_rad = 0.28
closed_gripper_rad = 0.64
hold_gripper_rad = 0.675
grasp_height_m = 0.055
grasp_pad_bottom_m = 0.030
lift_height_m = 0.33
place_height_m = 0.13
close_s = 2.5
lift_s = 4.0
transfer_s = 3.0
transfer_profile = "quintic"
release_s = 3.0
strain_limited_grip = false
early_stop_on_shape_failure = true

[job]
output_dir = "outputs/PhysicSolver/sorting_native_100g_collection"
timeout_s = 21600.0
