# 第一阶段：原装 Pro-M6 完整分拣；袋衣贴合间隙仅记录，严格质量另行报告。
inherit = "PhysicSolver_mujoco_vbd_sorting_package.toml"

[sim_world]
newton_substeps = 32
newton_iterations = 28

[scene]
cloth_usd_path = "assets/PhysicSolver/Package/v7_sorting/parcel_two_mesh.usd"
garment_mass_kg = 0.05
bag_mass_kg = 0.0051355064

[robot]
initial_gripper_rad = 0.28

[planner]
require_bag_gap_quality = false
early_stop_on_shape_failure = true
gripper_package_friction = 2.0
open_gripper_rad = 0.28
closed_gripper_rad = 0.64
hold_gripper_rad = 0.675
grasp_height_m = 0.055
grasp_pad_bottom_m = 0.03
lift_height_m = 0.33
place_height_m = 0.13
release_lowering_m = 0.064  # 张爪期间缓慢下降64mm，再抬起空夹爪。
close_s = 2.5
lift_s = 4.0
lower_s = 2.5
transfer_s = 3.0
transfer_profile = "quintic"
release_s = 3.0
minimum_release_drop_m = 0.0  # 支撑后放手：须无机器人接触且完整落台，仍记录下落量。

[job]
output_dir = "outputs/PhysicSolver/sorting_native_workflow_collection"
timeout_s = 21600.0
