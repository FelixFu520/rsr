# xpbd_vbd_cloth02_baseline
# 统一分类：机器人求解器_接触求解器_物体_工况；采集640×480。
# 历史工况：xpbd_vbd_pickplace_cloth。物理参数和原验收门限保持。
[sim_world]
backend = "isaacsim"
physics_engine = "newton"
newton_execution = "direct"
newton_solver = "xpbd"
newton_substeps = 10
newton_iterations = 20
newton_use_cuda_graph = true
physics_dt = 0.008333333333333333
rendering_dt = 0.06666666666666667
gravity = [ 0.0, 0.0, -9.81,]
device = "cuda:0"
headless = true
renderer = "RayTracedLighting"
width = 640
height = 480
rt_subframes = 1
warmup_frames = 2
fast_shutdown = true
background_usd_path = "assets/PhysicSolver/Isaac/Environments/Simple_Warehouse/warehouse_multiple_shelves.usd"
background_prim_path = "/World/background"
background_offset = [ -4.0, 0.0, 0.0,]
background_gravity = false
background_skip_metrics_assembler = true

[scene]
backend = "pickplace_cloth"
object_kind = "cloth"
table_usd_path = "assets/PhysicSolver/Table/Aligned.usd"
cloth_usd_path = "assets/PhysicSolver/Cloth/unisex_shirt.usd"
prim_path = "/World/scene"
table_scale = [ 2.0, 1.2, 1.0,]
table_xy = [ 0.0, 0.0,]
target_xy = [ 0.3, 0.0,]
robot_base_xy = [ -0.38, 0.0,]
cloth_initial_clearance = 0.015
cloth_thickness_scale = 0.03
grasp_vertex = 1922
friction = 1.2
[[scene.cameras]]
name = "overview"
prim_path = "/World/scene/overview_cam"
pose_relative_to = "/World/scene"
resolution = [ 640, 480,]
clipping_range = [ 0.1, 80.0,]
focal_length = 18.0
horizontal_aperture = 20.955

[scene.cameras.pose]
position = [ 1.8, 1.65, 1.85,]
orientation_wxyz = [ 0.3303108012, 0.2302877772, 0.5234982467, 0.7508740906,]

[robot]
backend = "franka_newton"
urdf_path = "assets/PhysicSolver/Robot/franka_emika_panda/urdf/fr3_franka_hand.urdf"
prim_path = "/World/robots/Franka"
base_position = [ -0.38, 0.0, 0.732389,]
base_orientation = [ 1.0, 0.0, 0.0, 0.0,]
initial_joint_positions = [ 0.0, -0.569, 0.0, -2.81, 0.0, 3.037, 0.741, 0.04, 0.04,]
arm_stiffness = 6000.0
arm_damping = 300.0
finger_stiffness = 1600.0
finger_damping = 40.0
finger_max_force = 60.0
finger_friction = 3.0
[[robot.cameras]]
name = "wrist"
prim_path = "/World/robots/Franka/fr3_link7/wrist_cam"
pose_relative_to = "/World/robots/Franka/fr3_link7"
resolution = [ 640, 480,]
clipping_range = [ 0.002, 20.0,]
focal_length = 8.0
horizontal_aperture = 20.955

[robot.cameras.pose]
position = [ 0.0282842712, -0.0282842712, 0.175,]
orientation_wxyz = [ 0.157148418, -0.3489283367, 0.8423875227, -0.3793898419,]

[planner]
backend = "pickplace_cloth"
cloth_solver = "vbd"
settle_s = 1.0
approach_s = 3.0
descend_s = 2.0
close_s = 2.0
lift_s = 3.0
hold_s = 2.0
transfer_s = 2.5
lower_s = 1.5
release_s = 1.0
retract_s = 1.5
rest_s = 2.0
approach_height_m = 0.18
lift_height_m = 0.25
place_offset_m = [ -0.05, -0.12, 0.0,]
place_height_m = 0.08
maximum_place_error_m = 0.08
retract_height_m = 0.12
grasp_offset_m = [ 0.0, 0.0, 0.006,]
tcp_orientation_wxyz = [ 0.0, 1.0, 0.0, 0.0,]
open_finger_m = 0.04
closed_finger_m = 0.006
open_gripper_control = false
minimum_lift_m = 0.08
minimum_release_drop_m = 0.04
maximum_patch_distance_m = 0.08
maximum_table_penetration_m = 0.02
grasp_patch_vertices = 20
ik_iterations = 24
particle_radius_m = 0.008
cloth_mass_kg = 0.2
cloth_stretch_stiffness = 10000.0
cloth_stretch_damping = 0.015
cloth_bend_stiffness = 5.0
cloth_bend_damping = 0.5
contact_stiffness = 50000.0
contact_damping = 50.0
cloth_friction = 0.25
table_friction = 0.4
friction_epsilon_cm_s = 0.1

[job]
backend = "pickplace_cloth"
output_dir = "outputs/physic_solver/xpbd_vbd_cloth02_baseline"
max_steps = 6000
timeout_s = 7200
inspect_gui = false

[job.recorder]
format = "lerobot_v3"
fps = 15
width = 640
height = 480
task = "xpbd_vbd_cloth02_baseline"
