# 采用宽夹垫，保留本工况位置与角度；40迭代精度下独立完整验收。
inherit = "v8_offset_x35.toml"

[sim_world]
newton_iterations = 40

[planner]
prepare_initial_pose = true
grasp_offset_m = "@reset [0.035, 0, 0]"  # 原(-25,40)mm保持阶段拉伸超限；保留角度，优化抓点。
grasp_yaw_deg = 30
grasp_pitch_deg = 10
grasp_height_m = 0.0734  # 倾斜后最低夹垫角低约2.5mm；较平抓配置提高3mm复测。
lift_s = 4.5  # 原3s工况在提升末段振荡并拉伸超限；仅放慢提升，完整重跑。
gripper_open_ramp_s = 0.5

[job]
output_dir = "outputs/physic_solver/package_cases/v8_offset_tilt10"
timeout_s = 7200.0
