# 复用源V10宽夹垫；按当前Franka实测高度关系换算，各款独立验收。
inherit = "../package_matrix_base.toml"

[scene]
cloth_usd_path = "assets/PhysicSolver/Package/v10/frosted_top/parcel_two_mesh.usd"

[robot]
backend = "franka_package_pads"

[planner]
grasp_offset_m = "@reset [0, 0, 0]"
grasp_height_m = 0.0779  # 源22.91mm夹垫底高度 + 当前实测约55mm的有效高度差。
closed_finger_m = 0.005  # 源保持阶段的10mm净夹缝。
gripper_close_ramp_s = 0.6
hold_s = 0.0
transfer_s = 2.0
lower_s = 1.5
place_height_m = 0.25

[job]
output_dir = "outputs/physic_solver/package_cases/v10_frosted_top"
