# 包裹迁移独立工况；质量指内容物，袋膜另计；spring 为显式辅助。
inherit = "../package_matrix_base.toml"

[scene]
cloth_usd_path = "assets/PhysicSolver/Package/v10/station_clothing/parcel_two_mesh.usd"

[robot]
backend = "franka_newton"

[planner]
grasp_offset_m = "@reset [0, 0, 0]"
grasp_height_m = 0.022
closed_finger_m = 0.0025
hold_s = 0.0
transfer_s = 2.0
lower_s = 1.0
place_height_m = 0.20  # 恢复原装指垫的既有12.3s控制组合，仍须完整验收。

[job]
output_dir = "outputs/physic_solver/package_cases/v10_station_clothing"
