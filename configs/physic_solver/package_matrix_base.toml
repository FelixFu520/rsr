# 新矩阵的稳定转运控制；原有已验收配置保持原值。
inherit = "mujoco_vbd_pickplace_package.toml"
[robot]
backend = "franka_package_pads"

[planner]
mujoco_cpu = true
grasp_height_m = 0.0704
closed_finger_m = 0.00625
place_height_m = 0.25
soft_contact_capacity = 32768
hold_s = 1.0
transfer_s = 3.0
lower_s = 1.5
post_shake_hold_s = 1.0
realign_before_release = true
