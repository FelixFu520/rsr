inherit = "kinematic_tgs_banana01_five_cuts.toml"

[sim_world]
renderer = "MinimalRendering"
minimal_shading_mode = 2
width = 640
height = 360
rendering_dt = 0.06666666666666667
synchronous_capture = false
rt_subframes = 1

[scene]
dynaconf_merge = false
backend = "banana_cutting"
asset_dir = "assets/PhysicSolver/Banana"
density_kg_m3 = 950
static_friction = 0.48
dynamic_friction = 0.35
restitution = 0.04
fragment_contact_offset_m = 0.0025

[[scene.cameras]]
name = "overview"
prim_path = "/World/Camera"
pose_relative_to = "/World"
resolution = [640, 360]
focal_length = 36
horizontal_aperture = 20.955
clipping_range = [0.005, 100]
[scene.cameras.pose]
position = [0.43, -0.65, 0.52]
orientation_wxyz = [0.8304660215179844, 0.47679734133313983, 0.1434369519934488, 0.2498325903571605]

[job]
output_dir = "outputs/debug/physic_solver/kinematic_tgs_banana01_five_cuts_debug"
[job.recorder]
fps = 15
width = 640
height = 360
