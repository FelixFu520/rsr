# V10 原尺寸刚性纸箱；显式260mm行程平行夹爪；MuJoCo双向刚体接触。
[sim_world]
backend = "isaacsim"
physics_engine = "newton"
newton_execution = "direct"
newton_solver = "mujoco"
physics_dt = 0.008333333333333333
newton_substeps = 4
newton_use_cuda_graph = true
device = "cuda:0"
headless = true
renderer = "RayTracedLighting"
rt_subframes = 4
width = 640
height = 480

[scene]
backend = "pickplace_carton"
object_kind = "rigid"
carton_usd_path = "assets/PhysicSolver/Package/v10/box02/source.usd"
carton_mass_kg = 0.25
target_xy = [0.10, 0.0]
robot_base_xy = [-0.34, 0.0]
table_scale = [1.3333333333333333, 0.8, 1.0]
fill_light_intensity = 200
key_light_intensity = 700

[[scene.cameras]]
name = "overview"
prim_path = "/World/scene/overview_cam"
pose_relative_to = "/World/scene"
pose = { position = [1.8, 1.65, 1.85], orientation_wxyz = [0.3303108012, 0.2302877772, 0.5234982467, 0.7508740906] }
resolution = [640, 480]
clipping_range = [0.1, 80.0]
focal_length = 18.0

[robot]
backend = "franka_carton_gripper"
base_position = [-0.34, 0.0, 0.732389]
initial_joint_positions = [0.2517040498, -0.1184279068, -0.2555039685, -2.5736421069, -0.0473251609, 2.4584764037, -0.7507677831, 0.125, 0.125]
control_mode = "position"
arm_stiffness = 6000
arm_damping = 300
finger_stiffness = 1600
finger_damping = 40
finger_max_force = 60
finger_friction = 1.4
maximum_finger_opening_m = 0.13

[planner]
mujoco_cpu = true
backend = "pickplace_carton"
rigid_contact_stiffness_n_m = 1000000
rigid_contact_damping_n_s_m = 1000
open_finger_m = 0.125
closed_finger_m = 0.058
place_height_m = 0.08
lift_height_m = 0.22
maximum_table_penetration_m = 0.0015
minimum_lift_m = 0.08
minimum_release_drop_m = 0.01
maximum_place_error_m = 0.08

[job]
backend = "pickplace_carton"
output_dir = "outputs/physic_solver/package_cases/v10_box02"
record_rgb = true
timeout_s = 1800
max_steps = 2000

[job.recorder]
fps = 15
width = 640
height = 480
save_failed_episodes = true
