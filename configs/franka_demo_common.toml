# Shared defaults for the independently registered Franka demos.
# Run from the repository root with ./app/python.sh. Child files select the case.

# Runtime/engine settings. Direct cloth solver substeps are in [planner].
[sim_world]
backend = "franka_demo"
headless = false
renderer = "RayTracedLighting"
rt_subframes = 1
physics_dt = 0.008333333333333333
rendering_dt = 0.03333333333333333
physics_engine = "physx"
physx_solver = "TGS"
newton_execution = "usd"
newton_solver = "mujoco"
newton_substeps = 1
newton_iterations = 10
newton_use_cuda_graph = true
newton_solver_options = {}
newton_config_options = {}
device = ""
physics_backend = ""
stage_usd_path = ""
background_usd_path = "assets/Demo/Isaac/Environments/Simple_Warehouse/warehouse_multiple_shelves.usd"
background_prim_path = "/World/background"
background_gravity = false
background_skip_metrics_assembler = true
wait_init_time = 2
dlss = false
auto_exposure = false
enable_newton = false
background_offset = [-4.0, 0.0, 0.0]
camera_eye = [1.8, 1.65, 1.85]
camera_target = [0.0, 0.0, 0.95]

# Copied assets; geometry is measured in meters. Vertex 1922 is a solid seam.
[scene]
backend = "franka_demo"
object_kind = "rigid"
table_usd_path = "assets/Demo/Table/Aligned.usd"
cube_usd_path = "assets/Demo/Cube/Aligned.usd"
cloth_usd_path = "assets/Demo/Cloth/unisex_shirt.usd"
prim_path = "/World/scene"
table_scale = [2.0, 1.2, 1.0]
table_xy = [0.0, 0.0]
# target_xy is set only in the case file; Dynaconf merges inherited arrays.
robot_base_xy = [-0.38, 0.0]
cube_mass = 0.1
object_clearance = 0.004
cloth_initial_clearance = 0.015
cloth_thickness_scale = 0.03
grasp_vertex = 1922
friction = 1.2

# Base Z is replaced with the measured tabletop before initialization.
[robot]
backend = "franka_demo"
usd_path = "assets/Demo/Isaac/Robots/FrankaRobotics/FrankaPanda/franka.usd"
urdf_path = "assets/Demo/Robot/franka_emika_panda/urdf/fr3_franka_hand.urdf"
prim_path = "/World/robots/Franka"
base_position = [-0.38, 0.0, 0.732389]
base_orientation = [1.0, 0.0, 0.0, 0.0]
initial_joint_positions = [0.0, -0.569, 0.0, -2.81, 0.0, 3.037, 0.741, 0.04, 0.04]
arm_stiffness = 1200.0
arm_damping = 80.0
finger_stiffness = 1600.0
finger_damping = 40.0
finger_max_force = 60.0
finger_friction = 3.0

# Durations are seconds. Positions/openings are meters unless named cm.
[planner]
backend = "franka_demo"
timeout_s = 1200.0
settle_s = 1.0
approach_s = 3.0
descend_s = 2.0
close_s = 2.0
lift_s = 3.0
hold_s = 2.0
release_s = 1.0
retract_s = 1.5
retract_height_m = 0.12
rest_s = 2.0
approach_height_m = 0.18
lift_height_m = 0.25
# grasp_offset_m defaults to zero; case overrides must not merge inherited arrays.
tcp_orientation_wxyz = [0.0, 1.0, 0.0, 0.0]
open_finger_m = 0.04
closed_finger_m = 0.0
open_gripper_control = false
minimum_lift_m = 0.08
minimum_release_drop_m = 0.04
maximum_patch_distance_m = 0.08
maximum_table_penetration_m = 0.02
grasp_patch_vertices = 20
newton_substeps = 10
newton_use_cuda_graph = true
solver_iterations = 10
cloth_solver = "vbd"
ik_iterations = 24
particle_radius_m = 0.008
cloth_mass_kg = 0.2
# cloth_density_cm is optional; omit to derive it from the other settings.
cloth_stretch_stiffness = 10000.0
cloth_stretch_damping = 0.015
cloth_bend_stiffness = 5.0
cloth_bend_damping = 0.5
contact_stiffness = 50000.0
contact_damping = 50.0
cloth_friction = 0.25
table_friction = 0.4
friction_epsilon_cm_s = 0.1
# XPBD uses distance springs rather than VBD's triangle material.
xpbd_spring_stiffness = 1000.0  # kg/s² = N/m
xpbd_spring_damping = 1.0  # kg/s = N·s/m
xpbd_self_contact = false  # XPBD has no topology-aware cloth self-collision.
xpbd_mass_lumping = "area"  # The unified XPBD experiment can select uniform masses.

# One finite trial; results, actual configuration and trajectory are persisted.
[job]
backend = "franka_demo"
inspect_gui = false
max_steps = 12000
timeout_s = 1200.0
render_stride = 4
keep_open = false
output_dir = "outputs/franka_demo"
capture_frames = true
record_video = false  # Enable with RSR_JOB__RECORD_VIDEO=true; writes grasp.mp4.
video_width = 1280
video_height = 720
fail_on_unsuccessful = true
