# Explicit all-Newton combination: XPBD robot and VBD cloth.
inherit = "franka_demo_common.toml"

[sim_world]
physics_engine = "newton"
newton_execution = "direct"
newton_solver = "xpbd"

[scene]
object_kind = "cloth"
target_xy = [0.30, 0.0]
grasp_vertex = 1922

[robot]
arm_stiffness = 6000.0
arm_damping = 300.0

[planner]
cloth_solver = "vbd"
closed_finger_m = 0.006
grasp_offset_m = [0.0, 0.0, 0.006]
solver_iterations = 20

[job]
output_dir = "outputs/franka_cloth_newton_xpbd"
