# 单件节拍入料；左臂成功柔性资产不变；右侧全程匀速运行。
inherit = "PhysicSolver_mujoco_vbd_sorting_package_collect.toml"

[scene]
clear_legacy_parcels = true
infeed_travel_m = 0.75
floor_z_m = 0.0
rigid_usd_path = "assets/PhysicSolver/Package/v10_box02/source.usd"
rigid_scale = 0.5
rigid_mass_kg = 0.03125
belt_markers = true
# 替换继承的相机列表，确保总览包含带端与地面。
cameras = '''@reset [{ name = "overview", prim_path = "/World/Cameras/overview", pose_relative_to = "/World", pose = { position = [3.2, -4.6, 4.4], orientation_wxyz = [0.820381835618835, 0.4335524724233305, 0.1742040276597923, 0.3296344250672163] }, resolution = [640, 480], clipping_range = [0.1, 80.0], focal_length = 18.0, horizontal_aperture = 20.955 }]'''

[planner]
backend = "sorting_stream"
infeed_speed_mps = 0.12
infeed_settle_s = 2.0
continuous_outfeed = true
floor_contact_stiffness = 400000.0
infeed_grasp_pad_bottom_m = 0.020
regrasp_surface_indent_m = 0.025
outfeed_place_height_m = 0.20
belt_speed_mps = 0.18
belt_transport_s = 6.0
rigid_closed_gripper_rad = 0.40
rigid_hold_gripper_rad = 0.42
rigid_pad_bottom_m = 0.015
sleep_soft_when_settled = true
rigid_contact_time_constant_s = 0.0005
rigid_mujoco_iterations = 100
rigid_mujoco_solver = "pgs"
rigid_disable_warmstart = false
separate_ground_drop_lanes = true
ground_lane_margin_m = 0.012
lower_drop_tcp_orientation_wxyz = [0.1830127018922193, 0.6830127018922193, 0.6830127018922193, -0.1830127018922193]

[job]
output_dir = "outputs/sorting_stream"
max_steps = 16000
timeout_s = 28800.0

[job.recorder]
task = "Relay a soft garment parcel followed by a rigid carton from the remote infeed belt through the platform with both native Pro-M6 arms, dropping each onto the continuously running outfeed belt."
