# 正式采集：1024×768（1K）/ 30 fps，双 GPU PathTracing；继承 2K 的物理与画质参数。
inherit = "kr210_physx_c1003b1a1.toml"

[sim_world]
width = 1024
height = 768
active_gpu = "@none"  # 清除父配置的单卡选择，让 Kit 枚举全部可用 RTX GPU
multi_gpu = true      # 本机 GPU 0 + GPU 1，在同一 Kit 进程内协同渲染
renderer_multithreading = false  # CPU 命令录制开关；此前单独关闭仍复现，不能视为根因修复

[scene]
dynaconf_merge = false  # 替换相机列表，避免继承时追加同名相机
backend = "battery_workcell"
usd_path = "assets/BatteryDisassembly/Scene/Battery/Battery.usd"
prim_path = "/World/scene"
position_m = [0.5102575125032827, 0.4987062452981176, 0.0]
yaw_deg = 0.0
battery_yaw_deg = -90.0

# -Y 侧抬高约 44° 俯视（源配置 overview_cam，D455 彩色相机内参 f=1.93 mm / 3.896 mm，水平视场 90.6°）
[[scene.cameras]]
name = "overview"
prim_path = "/World/scene/rsr_cameras/overview"
pose_relative_to = "/World/scene"
resolution = [1024, 768]
clipping_range = [0.1, 80.0]
focal_length = 1.93
horizontal_aperture = 3.896
pose = { position = [0.13, -3.77, 3.50], orientation_wxyz = [0.913685, 0.386895, -0.048533, -0.114615] }

[robot]
dynaconf_merge = false
backend = "kr210_dual"
usd_path = "assets/BatteryDisassembly/Robot/KR210_L150/kr210_l150.usd"
urdf_path = "assets/BatteryDisassembly/Robot/KR210_L150/kr210.urdf"
pose_relative_to = "/World/scene"
screwdriver_arm = { prim_path = "/World/robots/kr210_01", position_m = [-2.05, 0.0, 0.0], yaw_deg = 90.0 }
gripper_arm = { prim_path = "/World/robots/kr210_02", position_m = [2.05, 0.0, 0.0], yaw_deg = -90.0 }

# 螺丝刀腕部相机：tool0 下方 0.12 m、侧向 0.26 m，从侧面看批头与螺丝头（画面上方朝机器人）
[[robot.cameras]]
name = "screwdriver"
prim_path = "/World/robots/kr210_01/tool0/rsr_screwdriver_cam"
pose_relative_to = "/World/robots/kr210_01/tool0"
resolution = [1024, 768]
clipping_range = [0.02, 20.0]
focal_length = 1.93
horizontal_aperture = 3.896
pose = { position = [0.12, 0.26, 0.0], orientation_wxyz = [0.328173, -0.626341, 0.328173, 0.626341] }

# 夹爪相机：tool0 下 0.24 m（横梁下沿以下）、沿夹爪 x 外移 0.6 m，从盖板一端看两指夹持（源配置位置被腕部遮挡）
[[robot.cameras]]
name = "gripper"
prim_path = "/World/robots/kr210_02/tool0/rsr_gripper_cam"
pose_relative_to = "/World/robots/kr210_02/tool0"
resolution = [1024, 768]
clipping_range = [0.02, 20.0]
focal_length = 1.93
horizontal_aperture = 3.896
pose = { position = [0.24, 0.0, 0.60], orientation_wxyz = [0.703666, -0.069677, -0.069677, 0.703666] }

[job]
output_dir = "outputs/battery_disassembly/kr210_physx_c1003b1a1_1k"
monotonic_render_budget_clock = true  # 采集器在子进程启动前加载预算计时补丁；系统时间不变

[job.recorder]
capture_mode = "parallel_cameras"  # 固定三路 RenderProduct，按相机分配 GPU，消除轮流切换相机的等待

