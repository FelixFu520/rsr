inherit = "franka_demo_common.toml"

[sim_world]
physics_engine = "newton"
newton_execution = "direct"
newton_solver = "vbd"

[scene]
object_kind = "cloth"
target_xy = [0.30, 0.0]
grasp_vertex = 1922

[planner]
closed_finger_m = 0.006
# Keep the fingertips above the table: the open-jaw control must not fork-lift cloth.
grasp_offset_m = [0.0, 0.0, 0.006]

[job]
output_dir = "outputs/franka_cloth_newton"
