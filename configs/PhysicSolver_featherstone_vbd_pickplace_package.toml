# V7 双 Mesh 包裹；Featherstone 机械臂 + VBD 袋膜/衣物；独立双相机 LeRobot v3。
# 运行：./app/python.sh -m real2sim2real.core.cli collect run -c configs/PhysicSolver_featherstone_vbd_pickplace_package.toml
# V7 源资产复算未全部验收；本任务用自身 result.json 验证抓放，不继承源成功标签。

[sim_world]
backend = "isaacsim"
physics_engine = "newton"
newton_execution = "direct"  # 自建机器人/包裹模型，Kit 负责显示
newton_solver = "featherstone"  # 刚体机械臂；包裹接触由 VBD 求解
newton_substeps = 32  # 恢复 V7 原始离散精度；粗略预检发生过塌薄/滑脱。
newton_iterations = 28
newton_use_cuda_graph = true
physics_dt = 0.016666666666666666  # 官方 60 Hz；15 fps 录制，每 4 个物理步一帧
rendering_dt = 0.06666666666666667
gravity = [0.0, 0.0, -9.81]
device = "cuda:0"
headless = true
renderer = "RayTracedLighting"  # 近距离透明袋膜的 PathTracing 采集代价很高。
width = 640
height = 480
rt_subframes = 16  # 等待每路相机实际完成渲染的帧数，不推进物理。
samples_per_pixel_per_frame = 64
warmup_frames = 2
fast_shutdown = true
background_usd_path = "assets/PhysicSolver/Isaac/Environments/Simple_Warehouse/warehouse_multiple_shelves.usd"
background_prim_path = "/World/background"
background_offset = [-4.0, 0.0, 0.0]
background_gravity = false
background_skip_metrics_assembler = true
background_light_scale = 0.25  # 仓库自带灯与桌面补光叠加；统一降低曝光强度。

[scene]
backend = "pickplace_package"
object_kind = "cloth"  # 两个可变形表面，使用采集 Job 的 cloth 步进分支。
table_usd_path = "assets/PhysicSolver/Table/Aligned.usd"
cloth_usd_path = "assets/PhysicSolver/Package/v7/parcel_two_mesh.usd"
prim_path = "/World/scene"
table_scale = [1.3333333333333333, 0.8, 1.0]
table_xy = [0.0, 0.0]
target_xy = [0.10, 0.0]
robot_base_xy = [-0.42, 0.0]
fill_light_intensity = 162.5
key_light_intensity = 550.0

# 固定全景相机；USD 光学坐标为 -Z 向前、+Y 向上，四元数顺序 wxyz。
[[scene.cameras]]
name = "overview"
prim_path = "/World/scene/overview_cam"
pose_relative_to = "/World/scene"
pose = { position = [1.8, 1.65, 1.85], orientation_wxyz = [0.3303108012, 0.2302877772, 0.5234982467, 0.7508740906] }
resolution = [640, 480]
clipping_range = [0.1, 80.0]
focal_length = 18.0
horizontal_aperture = 20.955

[robot]
backend = "franka_package_pads"
urdf_path = "assets/PhysicSolver/Robot/franka_emika_panda/urdf/fr3_franka_hand.urdf"
prim_path = "/World/robots/Franka"
# Z 在 before_place_robot_hook 中由实际桌面高度替换。
base_position = [-0.42, 0.0, 0.732389]
base_orientation = [1.0, 0.0, 0.0, 0.0]
initial_joint_positions = [0.0, 0.0, 0.0, -1.59695, 0.0, 2.5307, 0.0, 0.0, 0.0]
control_mode = "velocity"
# 按用户选择采用 V7 长夹块；替换短指碰撞体，保留 Featherstone 手指关节。
pad_half_extents_m = [0.03, 0.007, 0.042]
pad_center_m = [0.0, 0.007, 0.055]
pad_density_kg_m3 = 1000.0  # 仿真块密度假设；每块约 70.56 g，未硬件标定。

# 腕部相机位于长夹块前方，沿间隙看向夹持区域（link7 的局部 Z≈0.25 m）。
[[robot.cameras]]
name = "wrist"
prim_path = "/World/robots/Franka/fr3_link7/wrist_cam"
pose_relative_to = "/World/robots/Franka/fr3_link7"
pose = { position = [0.06, 0.0, 0.175], orientation_wxyz = [0.2340572529, -0.6672459834, 0.6672459834, -0.2340572529] }
resolution = [640, 480]
clipping_range = [0.002, 20.0]
focal_length = 8.0
horizontal_aperture = 20.955

[planner]
backend = "pickplace_package"
cloth_solver = "vbd"
full_surface_contacts = true
contact_sdf_resolution = 64
# V7 的膜/衣物刚度、阻尼、逐点质量和内部弹簧从静态 USD 恢复，使用米/千克/秒。
contact_stiffness = 20000.0
contact_damping = 30.0
shape_contact_stiffness = 20000.0
shape_contact_damping = 30.0
shape_contact_friction = 1.4
cloth_friction = 1.4
table_friction = 0.5
self_contact_buffer = 512
friction_epsilon_m_s = 0.001
open_finger_m = 0.04
closed_finger_m = 0.00625
finger_velocity_gain = 6.0
arm_velocity_gain = 3.0
grasp_height_m = 0.0704  # TCP；V7 夹块最低面在其下方 42.4 mm，距桌面 28 mm。
lift_height_m = 0.18
place_offset_m = [0.0, -0.12, 0.0]
place_height_m = 0.17  # 长夹块悬挂包裹；留出释放后可测的自由回落距离。
minimum_lift_m = 0.08
minimum_release_drop_m = 0.01
maximum_table_penetration_m = 0.0015
maximum_place_error_m = 0.08

[job]
backend = "pickplace_cloth"
output_dir = "outputs/PhysicSolver/featherstone_vbd_pickplace_package"
max_steps = 6000
timeout_s = 3600.0  # V7 原始求解精度下，包含双相机渲染和录制的墙钟时限。
inspect_gui = false

[job.recorder]
format = "lerobot_v3"
fps = 15
width = 640
height = 480
task = "Grasp the V7 garment parcel, lift both the bag and its contents, transfer, and release it on the table."
# observation.state：7 个实测臂关节角 rad + 2 个实测手指开度 m。
# action：官方控制器实际下发的 7 个关节速度 rad/s + 2 个手指速度 m/s。
# observation.images.overview / observation.images.wrist：与状态/动作对齐的两路 H.264 RGB 视频。
