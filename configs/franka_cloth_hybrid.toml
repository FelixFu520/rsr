inherit = "franka_demo_common.toml"

[sim_world]
physics_engine = "hybrid"
newton_solver = "vbd"

[scene]
object_kind = "cloth"
target_xy = [0.30, 0.0]
grasp_vertex = 1922  # Solid side seam; keeps fingers out of the sleeve opening.

[robot]
# Compensate gravity with the position drive before closing above the tabletop.
arm_stiffness = 6000.0
arm_damping = 300.0

[planner]
# Finite pad gap: compress the cloth's collision thickness without overlapping pads.
closed_finger_m = 0.006
# Keep the real Panda fingertips clear of the PhysX tabletop while closing.
grasp_offset_m = [0.0, 0.0, 0.012]

[job]
output_dir = "outputs/franka_cloth_hybrid"
