# 调试配置：继承正式配置，结果写到 outputs/debug/fire_inspection（可重复运行，覆盖上次数据集）。
# 失败轨迹也导出为 diagnostic 数据；看 map/patrol_map*.png 与 diagnostics/<run>/ 排查。
inherit = "x30_physx_warehouse.toml"

[sim_world]
samples_per_pixel_per_frame = 64   # 调试用较低采样，加快一轮调试
rt_subframes = 6

[job]
output_dir = "outputs/debug/fire_inspection"
overwrite_dataset = true
timeout_s = 3600.0

[job.recorder]
save_failed_episodes = true
