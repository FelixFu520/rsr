# 零配置回退:未提供 settings.toml 时全部走 stub,CI 不必装 Isaac
[logging]
level = "INFO"  # 控制台和文件共用的最低日志级别
console = true  # 文本控制台输出

[sim_world]
backend = "stub"  # 不启动 Kit
# Featherstone 双相机采集示例：renderer="RayTracedLighting"、rt_subframes=4。
# samples_per_pixel_per_frame=64 仅 PathTracing 生效；采集核对真实渲染帧及相机矩阵。
# background_light_scale=1.0；引用背景子树的灯光强度倍率，官方衣服示例设为 0.25。

[scene]
backend = "stub"
# pickplace_cloth / pickplace_rigid 支持 [[scene.cameras]] 固定相机列表。
# 每项含 name、prim_path、pose_relative_to、pose、resolution 和可选镜头参数。
# 示例见 configs/PhysicSolver_featherstone_vbd_pickplace_cloth.toml。
# newton_cloth_franka 使用 newton_official/unisex_shirt.usd 和未经压扁的官方布局。
# cloth_base_color=[0.16,0.20,0.65]、cloth_roughness=0.92、cloth_specular=0.02。
# pickplace 系列场景：fill_light_intensity=650、key_light_intensity=2200。

# pickplace_package：cloth_usd_path="assets/PhysicSolver/Package/v7/parcel_two_mesh.usd"。
# target_xy=[0.10,0]、robot_base_xy=[-0.42,0]；保持两个网格及原始 UV/材质。
# sorting_package：station_usd_path 指向旧分拣工位，cloth_usd_path 使用 v7_sorting 独立快照。
# infeed_path/platform_path/outfeed_path 读取各自 USD 支撑面；support_depth_m=0.04。
# garment_mass_kg=0.2；bag_mass_kg 默认不覆盖袋膜质量。可显式设置两者并保持各自质量分布。
# initial_clearance_m=0.002、outfeed_target_xy=[-0.55,-0.876]。
# platform_target_xy：可选的平台落点；须在实测支撑范围内，未设置时使用中心。
# label_uv_bounds=[0.20,0.44,0.66,0.65]：V7 FrontPhotograph 中可见标签的 UV 矩形。
# clear_legacy_parcels=false：清理工位自带的 box01/box02/重复衣物视觉资产。
# infeed_travel_m=0：从目标点上游指定距离入料（沿世界 +Y），整包必须在带面范围内。
# floor_z_m=0：启用远端入料时增加真实落地碰撞面。
# rigid_usd_path=""、rigid_scale=0.5、rigid_mass_kg=0.03125：可选 V10 纸箱及声明的缩放/质量。
# belt_markers=false：用循环移动的细缝显示实际传送带表面偏移。

[robot]
backend = "stub"
# franka_newton / franka_physx 支持 [[robot.cameras]] 机载相机列表，字段与场景相机一致。
# 官方 cloth_franka 场景使用 franka_newton 的 control_mode="velocity"。
# franka_package_pads：V7 长夹块，pad_half_extents_m=[0.03,0.007,0.042]，
# pad_center_m=[0,0.007,0.055]；pad_density_kg_m3=1000 为未硬件标定的仿真密度。
# pro_m6_newton：保留原 USD 世界位姿、惯量与原生 Robotiq 碰撞近似。
# arm_stiffness/arm_damping=6000/300、finger_stiffness/finger_damping=40/1。
# finger_friction=1.4；cameras 支持头部及左右腕部挂载。
# initial_gripper_rad=0.0：可将初始夹爪设为打开姿态，所有从动关节遵守原 mimic 比例。
# pad_width_m=0.03：固定原生指垫，不修改机器人结构。

[planner]
backend = "stub"
# newton_cloth_franka：keyframe_limit=7（首轮抓放）；完整官方序列见 OFFICIAL_KEYFRAMES。
# final_settle_s=2；shape_contact_stiffness=50000、shape_contact_damping=50、shape_contact_friction=1.5。
# newton_cloth_franka 的 table_friction=1.5（官方默认），可独立于夹指摩擦设置。
# 官方手指默认 open_finger_m=0.032、closed_finger_m=0.004，单位为单侧米。
# full_surface_contacts=false；启用时对刚体网格生成 SDF，contact_sdf_resolution=64。
# keyframe_offset_m=[0,0,0]：以米平移官方末端路径，厚度变化时需重新验证抓放。
# finger_velocity_gain=1.0：夹指开合响应增益（1/s），速度受 URDF 限制。

# pickplace_package 参数与默认值见 PackagePlannerConfig 和包裹示例 TOML。
# V7 材料、质量和内部弹簧从 USD 的 parcel:runtimeParameters / physics:masses 读取。
# self_contact_buffer=512、friction_epsilon_m_s=0.001、grasp_height_m=0.0704（V7 长夹块）。
# closed_finger_m=0.00625、lift_height_m=0.18、place_offset_m=[0,-0.12,0]。
# place_height_m=0.17：长夹块的 TCP 释放高度，确保包裹松开后回落。
# arm_velocity_gain=3.0：受 URDF 速度上限约束的机械臂速度跟踪增益。
# 包裹也支持 MuJoCo + robot.control_mode="position"，记录关节位置目标。
# grasp_offset_m=[0,0,0]：相对包裹中心的抓取偏移；放置目标仍按包裹中心验收。
# approach_s/descend_s/close_s/lift_s/transfer_s/lower_s/release_s/retract_s/rest_s
# 默认依次为 2/1.5/1.5/2/1.5/1/1/1/1.5 秒；原装短指示例使用较慢抬升/转运。
# align_place_to_com=false：开启后在转运开始时，按实测衣物质心平移剩余路径对齐落点。
# sorting_package：mujoco_cpu=true、mujoco_iterations=100；VBD 仍由 CUDA 执行。
# tcp_orientation_wxyz=[0,0.70710678,0.70710678,0]：世界 X 闭合；预抓取和全程 IK 统一配置。
# gripper_package_friction=None：可单独指定四个原生内指与包裹的有效接触摩擦系数。
# Newton 按几何平均合成；此字段只换算内指材料系数，不改变布料自接触或支撑摩擦。
# mujoco_control_per_frame=true：每个 60 Hz 帧同步一次恒定控制和零外力，子步仍完整求解。
# mujoco_substeps_per_vbd_step=1：原生 CPU 批处理可单独提高刚体子步数；VBD 步长须实测验收。
# self_contact_gap_m=None：包裹默认沿用资产的自接触额外搜索距离，接触厚度仍为 1.6 mm。
# mimic_time_constant_s=0.0015（不小于两倍子步 dt）、mimic_impedance=0.999。
# open_gripper_rad/closed_gripper_rad=0/0.64；hold_gripper_rad=0.675，控制原生夹爪主轴，非 Franka 指开度。
# grasp_height_m=0.048：包含源 30×7.5×70 mm 指垫盒；其闭合时比 TCP 前伸约 36 mm。
# return_s=2：松手撤离后，返回安全停靠位再进入另一臂的抓取；rest 阶段保持关节目标。
# hold_s=0：可在提升后保持原关节目标静置，再开始转运；示例设为 1 s。
# grasp_pad_bottom_m 默认不设置；设置时按原生夹爪 FK 补偿闭合过程的 TCP 高度。
# infeed_grasp_pad_bottom_m=None：可单独覆盖左臂入料抓取深度，不改变平台重抓深度。
# regrasp_surface_indent_m=None：可按平台衣物实时中央表面的 90% 高度分位设置右臂下压深度。
# regrasp_surface_indent_fraction：可按表面离台高度比例下压，米制 indent 此时作为下限。
# grasp_offset_xy_m=[0,0]：世界 XY 中相对实时衣物质心的抓取点偏移，放置目标仍为质心。
# regrasp_offset_xy_m：可选的右臂独立抓点偏移；未设置时沿用 grasp_offset_xy_m。
# platform_friction：可单独覆盖中间平台的材料摩擦；未设置时沿用 table_friction。
# early_stop_on_shape_failure=true；诊断时可关闭提前终止，最终形状验收门限保持不变。
# require_bag_gap_quality=true；流程优先配置可设 false，间隙仅记录，仍检查形状、丢抓与穿透。
# release_lowering_m=0：可在张爪期间同步降低 TCP，减少袋膜受牵拉；仅改变机器人控制目标。
# transfer_profile="cubic"；"quintic" 使用起止速度及加速度均为零的五次转运曲线。
# strain_limited_grip=false；开启后按真实网格拉伸微调夹爪目标，不改变粒子或验收门限。
# grip_strain_target=1.18、grip_maximum_relief_rad=0.01、grip_relief_rate_rad_s=0.05。
# grip_recovery_rate_rad_s=0.005、grip_strain_hysteresis=0.03：低拉伸时的恢复速度和死区。
# open_gripper_rad=0.28 对应约 81 mm 指垫开口；底边目标不消除实际关节跟踪误差。
# physics_origin_m=[0,0,0]：可选的整体求解坐标平移；控制、USD 和缓存仍用世界坐标。
# belt_speed_mps=0.35、belt_transport_s=6、minimum_belt_displacement_m=0.30。
# infeed_speed_mps=0.06、infeed_settle_s=2：低速送达抓取位置后暂停入料，等待抓取。
# continuous_outfeed=false：设为 true 后出料带从初帧持续运行，离带后仍保持速度。
# outfeed_place_height_m=None：可单独提高右臂松手 TCP，不改变平台交接高度。
# floor_contact_stiffness=None：可单独设置地面 VBD 法向接触刚度，不改变抓取或带面材料。
# sorting_stream：同一连续 MuJoCo/VBD 世界先柔性后刚性；参见 sorting_stream 示例。
# rigid_closed_gripper_rad=0.40、rigid_hold_gripper_rad=0.42、rigid_pad_bottom_m=0.015。
# sleep_soft_when_settled=true：仅已落地静止且距纸箱超过 0.2 m 的柔性包裹可休眠；接近时唤醒。
# rigid_contact_time_constant_s=0.0005：纸箱原生接触使用临界阻尼，不改 VBD 材料。
# rigid_mujoco_iterations=100、rigid_mujoco_solver="pgs"：纸箱出生后的原生算法/迭代次数。
# rigid_disable_warmstart=false：原生 PGS 保留 warmstart；可用于独立算法对照实验。
# separate_ground_drop_lanes=false、ground_lane_margin_m=0.012：按已落地柔性网格选择纸箱出料侧位。
# lower_drop_tcp_orientation_wxyz=None：可为靠外的出料侧位指定可达的单位 TCP 四元数。
# maximum_edge_stretch=1.3、minimum_triangle_area_ratio=0.03；沿用 V7 的形变检查。
# maximum_shape_rms_m=0.037413、maximum_bag_gap_m=0.01、maximum_tcp_error_m=0.03。
# label_up_min_cos=0.9；每次放置后使用实际标签网格法线检查。

[job]
backend = "stub"  # StubJob 只串工厂,不采集
# pickplace_cloth 的 timeout_s=1800：包含采集与渲染的墙钟时限；运行中约每 30 秒记录进度。
# sorting_package：timeout_s=14400，output_dir 使用独立的分拣目录，LeRobot v3 记录 16 维关节角。
